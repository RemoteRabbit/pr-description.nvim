name: Documentation

on:
  push:
    branches: [main, master]
    paths:
      - "lua/**/*.lua"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  vimdoc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Generate vimdoc
        uses: kdheepak/panvimdoc@1f9433df889d4ab3daa5ea52c7069cb489ad47d6 # main
        with:
          vimdoc: pr-description
          version: "Neovim >= 0.9.0"
          titledatepattern: "%Y-%m-%d"
          demojify: false
          treesitter: true

      - name: Create PR for vimdoc changes
        id: vimdoc-pr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          commit-message: "docs: auto-generate vimdoc"
          title: "docs: auto-generate vimdoc"
          branch: docs/auto-vimdoc
          delete-branch: true
          add-paths: doc/

      - name: Enable auto-merge for vimdoc PR
        if: steps.vimdoc-pr.outputs.pull-request-number
        run: gh pr merge --auto --squash "${{ steps.vimdoc-pr.outputs.pull-request-number }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  luadoc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Install LuaLS
        uses: leafo/gh-actions-lua@6919171ccf181b826f44b9bca76307b577217377 # v13
        with:
          luaVersion: "5.1"

      - name: Generate API docs
        run: |
          mkdir -p doc/api
          lua scripts/generate-api-docs.lua

      - name: Create PR for API docs changes
        id: api-docs-pr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          commit-message: "docs: auto-generate API reference"
          title: "docs: auto-generate API reference"
          branch: docs/auto-api-reference
          delete-branch: true
          add-paths: doc/

      - name: Enable auto-merge for API docs PR
        if: steps.api-docs-pr.outputs.pull-request-number
        run: gh pr merge --auto --squash "${{ steps.api-docs-pr.outputs.pull-request-number }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
