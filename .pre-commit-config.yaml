repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: mixed-line-ending

  - repo: https://github.com/JohnnyMorganz/StyLua
    rev: v2.3.1
    hooks:
      - id: stylua-github
        args: [--config-path=stylua.toml]

  - repo: https://github.com/lunarmodules/luacheck
    # Pinned to master (post-v1.2.0) for Lua 5.5 compatibility; v1.2.0 crashes
    # on Lua 5.5 because standards.lua reassigns a const for-loop variable.
    rev: f47ad699b5aab8eba5494a2b63e26c24dbf486ce
    hooks:
      - id: luacheck
        args: [--config=.luacheckrc]

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]

  - repo: local
    hooks:
      - id: check-lua-syntax
        name: Check Lua Syntax
        entry: bash -c 'for f in "$@"; do luac -p "$f" || exit 1; done' --
        language: system
        files: \.lua$
        types: [lua]

      - id: update-readme-config
        name: Update README config section
        entry: bash -c 'lua scripts/update-readme-config.lua && git add README.md'
        language: system
        files: lua/pr-description/config\.lua$
        pass_filenames: false
